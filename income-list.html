<!doctype html><html lang="ja"><head><script src="deployment-config.js"></script><script src="deployment-bootstrap.js"></script><script src="beta-config.js?v=20261127-income2"></script><script src="beta-gate.js?v=20261127-income2"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>入金一覧｜売上進捗管理システム</title><link rel="stylesheet" href="income-list.css?v=20261127-income2"><script src="member-store.js?v=20261127-income2"></script><script src="access-policy.js?v=20261127-income2"></script><script src="access-runtime.js?v=20261127-income2"></script><script src="other-income.js?v=20261127-income2"></script><script src="cash-ledger.js?v=20261128-order1"></script><script src="cash-store.js?v=20261127-income2"></script><script src="company-ledger.js?v=20261128-order1"></script><script src="money-input.js?v=20261127-income2"></script><script src="list-order.js?v=20261128-order1"></script><link rel="stylesheet" href="compact-ui.css?v=20261128-layout1"></head><body>
<header><span>売上進捗管理システム</span><a href="home.html">ホームへ</a></header><main>
<div class="page-heading"><h1>入金一覧</h1></div><div class="ledger-command-bar"><div class="outstanding"><span>未入金合計 <small>全期間</small></span><strong id="outstanding-total"></strong></div><div class="ledger-command-actions"><div class="other-actions"><button id="other-new">その他入金を登録</button> <button id="other-edit">その他入金の編集</button></div><button id="report">入金一覧表出力</button></div></div><p class="summary-note" style="margin:8px 0 14px"><strong>工事入金は、この一覧では入力・編集できません。</strong><br>各工事の「工事情報」→「入金・支払」で入力・修正した内容が反映されます。その他入金は上のボタンから登録・編集できます。</p>
<section id="other-editor" hidden></section><p id="other-status" role="status"></p>
<p class="summary-note">過年度の未入金も含む全期間の合計です。検索・絞り込みでは変わりません。</p>
<section class="filters" aria-label="入金の絞り込み"><label class="search"><span>検索</span><input id="search" type="search" placeholder="工事名・施主／元請・請求名で検索"></label><label><span>入金期限月／その他入金月</span><input id="month" type="month"></label><label><span>表示</span><select id="state"><option value="all">入金済・未入金</option><option value="unpaid">未入金</option><option value="paid">入金済</option></select></label><label><span>並び順</span><select id="sort"><option value="new">新しい日付順</option><option value="due">入金期限日順</option><option value="client">施主・元請名順</option><option value="amount">金額の大きい順</option></select></label><button id="reset">解除</button></section>
<div class="table-wrap"><table><thead><tr><th class="job-col">工事名・施主／元請・内容</th><th>請求名</th><th class="money-col">入金額（税込）</th><th class="date-col">請求日</th><th class="date-col">入金期限日</th><th class="date-col">実績入金日</th><th class="state-col">状態</th></tr></thead><tbody id="income-rows"></tbody></table></div>
<div id="income-cards" class="cards"></div><p id="count" class="count"></p>
<p class="prototype-note">受注済み工事の入金と、登録したその他入金を表示します。その他入金は工事の売上・利益に含めません。</p>
</main><script src="cloud-page-loader.js?v=20261127-nav1" data-controller="income-list.js?v=20261128-order1"></script><script src="other-income-ui.js?v=20261128-order1"></script><script src="list-print.js?v=20261127-income2"></script><script src="ledger-report.js?v=20261127-actual1"></script><script src="back-navigation.js?v=20261127-nav1"></script><script src="workspace-layout.js?v=20261128-layout1"></script></body></html>
