<header><span>売上進捗管理システム</span><a href="home.html">ホームへ</a></header><main>
<div class="page-heading"><h1>入金一覧</h1><button id="report">入金一覧表出力</button></div>
<div class="outstanding"><span>未入金合計 <small>全期間</small></span><strong id="outstanding-total"></strong></div>
<p class="summary-note">過年度の未入金も含む全期間の合計です。検索・絞り込みでは変わりません。</p>
<section class="filters" aria-label="入金の絞り込み"><label class="search"><span>検索</span><input id="search" type="search" placeholder="工事名・施主／元請・請求名で検索"></label><label><span>入金期限月</span><input id="month" type="month"></label><label><span>表示</span><select id="state"><option value="all">入金済・未入金</option><option value="unpaid">未入金</option><option value="paid">入金済</option></select></label><label><span>並び順</span><select id="sort"><option value="due">入金期限日順</option><option value="client">施主・元請名順</option><option value="amount">金額の大きい順</option></select></label><button id="reset">解除</button></section>
<div class="table-wrap"><table><thead><tr><th class="job-col">工事名・施主／元請</th><th>請求名</th><th class="money-col">入金額（税込）</th><th class="date-col">請求日</th><th class="date-col">入金期限日</th><th class="date-col">入金実績日</th><th class="state-col">状態</th></tr></thead><tbody id="income-rows"></tbody></table></div>
<div id="income-cards" class="cards"></div><p id="count" class="count"></p>
<p class="prototype-note">受注済み工事の入金・支払カードを表示します。</p>
