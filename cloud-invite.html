<!doctype html><html lang="ja"><head><script src="deployment-config.js"></script><script src="deployment-bootstrap.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><script src="beta-config.js"></script><script src="beta-gate.js"></script><title>招待から参加｜売上進捗管理システム</title><link rel="stylesheet" href="login.css"><link rel="stylesheet" href="auth.css"></head><body><main><section class="login-card"><h1>招待から参加</h1><p id="company"></p><p id="status" role="status">招待を確認しています…</p><form id="form" hidden><div class="field"><label for="email">ログインID（メールアドレス）</label><input id="email" readonly type="email"></div><div class="field"><label for="name">ユーザー名</label><input id="name" autocomplete="nickname" required></div><div id="credentials"><div class="field"><label for="password">パスワード</label><input id="password" type="password" autocomplete="new-password" required></div><div class="field" id="confirm-field"><label for="confirm">パスワード（確認）</label><input id="confirm" type="password" autocomplete="new-password" required></div></div><button id="submit" class="login-button">確認メールを送る</button></form><button id="mode" class="secondary" hidden>既存のアカウントで参加</button><button id="signout" class="secondary" hidden>別のアカウントでログインする</button><a id="home" class="back" hidden>ホームへ</a></section></main><script src="cloud-setup-model.js"></script><script src="supabase-sdk.js"></script><script src="cloud-invite.js"></script></body></html>
