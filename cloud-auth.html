<!doctype html><html lang="ja"><head><script src="deployment-config.js"></script><script src="deployment-bootstrap.js"></script><script src="beta-config.js"></script><script src="beta-gate.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>クラウド利用の登録・ログイン｜売上進捗管理システム</title><link rel="stylesheet" href="login.css"><link rel="stylesheet" href="auth.css"></head><body><header class="brand">売上進捗管理システム</header><main><section class="login-card"><h1 id="title">クラウド利用の登録・ログイン</h1><p class="lead">Supabaseへの登録・ログインを行います。今あるPC内の工事データはそのまま残ります。</p><div id="auth-tabs" style="display:flex;gap:8px;margin-bottom:20px"><button type="button" class="secondary" data-mode="login">ログイン</button><button type="button" class="secondary" data-mode="signup">新しく登録</button></div><form id="auth-form" hidden><div class="field" id="name-field" hidden><label for="user-name">ユーザー名</label><input id="user-name" autocomplete="nickname"></div><div class="field" id="email-field"><label for="email">メールアドレス</label><input id="email" type="email" autocomplete="username" required></div><div class="field" id="password-field"><label for="password">パスワード</label><input id="password" type="password" autocomplete="current-password" required></div><div class="field" id="confirm-field" hidden><label for="confirm">パスワード（確認）</label><input id="confirm" type="password" autocomplete="new-password"></div><button type="submit" class="login-button" id="submit">ログイン</button></form><button class="secondary" id="forgot" type="button">パスワードを忘れた方</button><button class="secondary" id="resend" type="button" hidden>確認メールを再送</button><div id="signed-in" hidden><p id="identity"></p><h2 style="font-size:17px">所属する事業者</h2><div id="companies"></div><form id="company-form" hidden><div class="field"><label for="business-type">事業者区分</label><select id="business-type" required><option value="">選択してください</option><option value="individual">個人</option><option value="corporation">法人</option></select></div><div class="field"><label for="company-name">会社名・屋号</label><input id="company-name" autocomplete="organization" required></div><button type="submit" class="login-button" id="create-company">事業者を登録する</button><p class="hint">登録したあなたがオーナーになります。会社情報は後から充実させられます。</p></form><a class="secondary link-button" id="cloud-jobs-link" href="app-entry.html" hidden>ホームへ</a><button class="secondary" id="signout" type="button">ログアウト</button></div><p id="status" role="status" aria-live="polite">接続設定を確認しています…</p><a class="back" href="cloud-setup.html">Supabase接続設定</a></section></main><script src="cloud-setup-model.js"></script><script src="supabase-sdk.js"></script><script src="cloud-auth.js"></script></body></html>
