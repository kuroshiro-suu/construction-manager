<!doctype html><html lang="ja"><head><script src="deployment-config.js"></script><script src="deployment-bootstrap.js"></script><script src="beta-config.js"></script><script src="beta-gate.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>支出台帳｜売上進捗管理システム</title><link rel="stylesheet" href="expenses.css"><script src="member-store.js"></script><script src="access-policy.js"></script><script src="access-runtime.js"></script></head><body>
<header><span>売上進捗管理システム</span><a href="home.html">ホームへ</a></header><main>
<div class="page-heading"><h1 id="page-title">支出台帳</h1><span class="badge">UI試作</span></div>
<p id="business-type-notice" class="account-note"></p><p class="account-note">実際の支出を記録する台帳です。会計上の経費・損益や減価償却は扱いません。</p>
<section id="ledger-view" aria-label="支出台帳の一覧">
<div class="toolbar"><div class="actions"><button id="new-entry" class="primary">＋ 新規登録</button><button id="edit-entry">編集</button><button id="report">支出一覧表出力</button></div><span class="total-label">表示分の支出合計 <strong id="ledger-total"></strong></span></div>
<div class="filters"><label class="search-label"><span>検索</span><input id="search" type="search" placeholder="内容・メモで検索"></label><label class="month-label"><span>月で絞り込み</span><input id="month" type="month"></label><button id="clear-filter">解除</button></div>
<div class="ledger-wrap"><table class="ledger"><thead><tr><th class="date-col">日付</th><th>内容</th><th class="amount-col">金額</th><th class="category-col">種別</th><th class="method-col">支払方法</th><th class="note-col">メモ</th></tr></thead><tbody id="ledger-rows"></tbody></table></div><p class="list-count" id="list-count"></p>
</section>
<section id="entry-view" aria-label="支出の連続入力" hidden>
<p class="entry-hint" id="entry-hint"></p>
<div class="entry-toolbar"><div class="actions" id="add-tools"><button id="add-one">＋1行</button><button id="add-ten">＋10行</button></div><button id="undo" disabled>元に戻す</button></div>
<p class="grid-help" style="font-size:12px;color:#647586">範囲選択：ドラッグ／Shift＋矢印　コピー：Ctrl＋C　貼り付け：Ctrl＋V　内容を削除：Delete ／ 右クリックでも操作できます</p><div class="entry-wrap"><table class="entry-grid"><thead><tr><th class="date-col">日付</th><th>内容</th><th class="amount-col">金額</th><th class="category-col">種別</th><th class="method-col">支払方法</th><th class="note-col">メモ</th></tr></thead><tbody id="entry-rows"></tbody></table></div>
<div class="entry-footer"><button id="back-ledger">台帳へ戻る</button><span class="total-label">入力分の合計 <strong id="draft-total"></strong></span><button id="register" class="primary">まとめて登録</button></div>
<p class="help">Tabで次のセル、Enterで下のセルへ。空行は登録しません。金額は税込で入力します。</p>
</section>
<p id="status" role="status" aria-live="polite"></p><p class="prototype-note">登録・編集した支出はこのブラウザに保存し、日付・金額ごとに収支台帳へ反映します。</p>
</main><script src="grid-menu.js"></script><script src="estimate-grid.js"></script><script src="simple-grid.js"></script><script src="expense-options.js"></script><script src="cash-ledger.js"></script><script src="cloud-page-loader.js" data-controller="expenses.js"></script><script src="list-print.js"></script><script src="ledger-report.js"></script></body></html>
