<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ログイン画面｜PC・スマホ比較</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; background: #e9eef3; color: #253443; font: 16px/1.6 'Yu Gothic',Meiryo,sans-serif; }
    h1 { margin: 0; font-size: 24px; } p { margin: 8px 0 24px; }
    .comparison { display: flex; align-items: flex-start; gap: 28px; flex-wrap: wrap; }
    h2 { margin: 0 0 10px; font-size: 16px; }
    .desktop { width: 768px; height: 540px; overflow: hidden; border: 1px solid #9aaebf; border-radius: 8px; background: white; }
    .desktop iframe { width: 1280px; height: 900px; transform: scale(.6); transform-origin: top left; }
    .phone { width: 390px; height: 844px; border: 1px solid #9aaebf; border-radius: 16px; overflow: hidden; background: white; }
    .phone iframe { width: 390px; height: 844px; }
    iframe { display: block; border: 0; }
    a { color: #205b86; }
    .hint { font-size: 14px; color: #526778; }
    @media(max-width: 820px) { body { padding: 16px; } .comparison { display: block; } section { margin-bottom: 24px; overflow-x: auto; } }
  </style>
</head>
<body>
  <h1>ログイン画面</h1>
  <p>呼称の案：ログイン画面。PC・横画面とスマホ・縦画面を並べて確認できます。</p>
  <div class="comparison">
    <section aria-label="PC表示の見本">
      <h2>PC・横画面 <span class="hint">1280 × 900／縮小表示</span></h2>
      <div class="desktop"><iframe src="login.html" title="ログイン画面のPC表示"></iframe></div>
    </section>
    <section aria-label="スマートフォン表示の見本">
      <h2>スマホ・縦画面 <span class="hint">390 × 844</span></h2>
      <div class="phone"><iframe src="login.html" title="ログイン画面のスマホ表示"></iframe></div>
    </section>
  </div>
  <p class="hint">画面だけの試作です。ログイン・登録・パスワード再設定の通信は行いません。</p>
  <a href="login.html">実際の幅でログイン画面を開く</a>　／　<a href="index.html">工事一覧を見る</a>
</body>
</html>
