<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>工事情報｜売上進捗管理システム</title>
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="construction.css">
</head>
<body data-page="construction">
<main class="shell">
<header class="header"><div class="brand">売上進捗管理システム</div><a class="back-to-list" href="index.html">工事一覧へ</a></header>
<section class="panel">
<div class="detailtop"><div><div class="tiny muted" id="job-number"></div><h1>工事情報</h1></div><span id="detail-status" class="badge"></span></div>
<div class="detail-columns">
<div class="basic-column">
<section class="detail-section" aria-labelledby="basic-heading">
<h2 id="basic-heading">基本情報</h2>
<fieldset class="category-field"><legend>受注区分</legend><div class="radioline"><label><input name="category" type="radio" value="自社">自社</label><label><input name="category" type="radio" value="下請">下請</label><label><input name="category" type="radio" value="元請">元請</label></div></fieldset>
<div class="field"><label for="job-name">工事名</label><input id="job-name"></div>
</section>
<section class="detail-section" aria-labelledby="client-heading">
<h2 id="client-heading">施主・元請情報</h2>
<div class="formrow"><div class="field"><label for="client-name">氏名・会社名</label><input id="client-name"></div><div class="field"><label for="honorific">敬称</label><select id="honorific"><option>様</option><option>御中</option></select></div></div>
<div class="field"><label for="client-address">住所</label><input id="client-address" autocomplete="street-address"></div>
<div class="field"><label for="client-phone">電話番号</label><input id="client-phone" type="tel"></div>
</section>
</div>
<div class="progress-column">
<section class="detail-section" aria-labelledby="dates-heading">
<h2 id="dates-heading">工期・進捗</h2>
<div class="field"><label>工期</label><div class="period"><input type="date" id="period-start" aria-label="工期の着工日"><span>〜</span><input type="date" id="period-end" aria-label="工期の完工日"></div></div>
<div class="progress-dates"><div class="field"><label for="order-date">受注日</label><input type="date" id="order-date"></div><div class="field"><label for="completion-date">完工日</label><input type="date" id="completion-date"></div><div class="field"><label for="posting-date">計上日</label><input type="date" id="posting-date"></div></div>
<p class="sectionhint">完工日は実際に完成した日。計上日は支払額の確定後に入力します。</p>
<div id="posting-alert" class="notice hidden"></div>
</section>
<section class="detail-section finance-section" aria-labelledby="finance-heading">
<h2 id="finance-heading">工事収支 <span class="amount-note">予定金額は税抜</span></h2>
<div class="metrics"><div class="metric"><small>請負金額</small><b id="metric-contract">—</b></div><div class="metric"><small>実行予算額</small><b id="metric-budget">—</b></div><div class="metric"><small>予定利益</small><b id="metric-profit">—</b></div><div class="metric"><small>予定利益率</small><b id="metric-rate">—</b></div></div>
<div class="metrics actual hidden" id="actual-metrics"><div class="metric"><small>実績原価（試算）</small><b id="metric-actual">—</b></div><div class="metric"><small>実績利益（試算）</small><b id="metric-actualprofit">—</b></div><div class="metric"><small>実績利益率（試算）</small><b id="metric-actualrate">—</b></div></div>
<div class="sectionhint" id="metrics-hint"></div><p class="sectionhint">※会計上の利益とは異なります。</p>
</section>
</div>
</div>
<section class="detail-actions" aria-label="工事に関する操作">
<div class="mainbuttons"><button data-action="estimate">見積作成</button><button data-action="cash">入金・支払</button><button data-action="documents">帳票出力</button></div>
<button class="history" data-action="history"><span><b>帳票出力状況</b><span class="history-summary muted" id="history-summary"></span></span><span class="history-detail">詳細</span></button>
<div class="bottomtools"><button class="btn ghost" data-action="branch">＋ 追加工事</button><button class="btn primary" id="save-job">更新</button></div>
</section>
</section>
<p class="prototype-note">画面の試作です。金額はサンプル、保存先はこのブラウザ内です。</p>
</main>
<div class="modalwrap" id="modalwrap" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal"><h3 id="modal-title"></h3><div id="modal-content"></div><div class="modalfooter"><button class="btn" id="modal-close">閉じる</button><button class="btn primary hidden" id="modal-confirm">登録</button></div></div></div><div id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
