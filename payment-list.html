<!doctype html><html lang="ja"><head><script src="deployment-config.js"></script><script src="deployment-bootstrap.js"></script><script src="beta-config.js"></script><script src="beta-gate.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>支払一覧｜売上進捗管理システム</title><link rel="stylesheet" href="income-list.css"><link rel="stylesheet" href="payment-list.css"><script src="member-store.js"></script><script src="access-policy.js"></script><script src="access-runtime.js"></script><script src="cash-ledger.js"></script><script src="cash-store.js"></script><script src="company-ledger.js"></script></head><body>
<header><span>売上進捗管理システム</span><a href="home.html">ホームへ</a></header><main>
<div class="page-heading"><h1>支払一覧</h1><button id="report">支払い一覧表出力</button></div>
<div class="outstanding"><span>未支払合計 <small>未確定含む・全期間</small></span><strong id="outstanding-total"></strong></div>
<p class="summary-note">過年度の未払も含む全期間の参考合計です。未確定分は税込実行予算を使用し、検索・絞り込みでは変わりません。</p>
<section class="filters" aria-label="支払の絞り込み"><label class="search"><span>検索</span><input id="search" type="search" placeholder="取引先・工事名・備考で検索"></label><label><span>支払予定月</span><input id="month" type="month"></label><label><span>表示</span><select id="state"><option value="all">全て</option><option value="unpaid">未払（未確定含む）</option><option value="pending">金額未確定</option><option value="paid">支払済</option><option value="none">支払不要（0円）</option></select></label><label><span>並び順</span><select id="sort"><option value="due">支払予定日順</option><option value="vendor">取引先名順</option><option value="amount">金額の大きい順</option></select></label><button id="reset">解除</button></section>
<div class="table-wrap"><table><thead><tr><th class="vendor-col">取引先</th><th class="job-col">工事名</th><th class="budget-col">実行予算額（税込）</th><th class="money-col">支払額（税込）</th><th class="date-col">支払予定日</th><th class="date-col">支払実績日</th><th class="state-col">状態</th><th class="memo-col">備考</th></tr></thead><tbody id="payment-rows"></tbody></table></div>
<div id="payment-cards" class="cards"></div><p id="count" class="count"></p>
<p class="prototype-note">受注済み工事の入金・支払カードを表示します。</p>
</main><script src="cloud-page-loader.js" data-controller="payment-list.js"></script><script src="list-print.js"></script><script src="ledger-report.js"></script></body></html>
