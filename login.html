<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ログイン｜売上進捗管理システム</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <header class="brand"><span class="brand-mark" aria-hidden="true">工</span><span>売上進捗管理システム</span></header>
  <main>
    <section class="login-card" aria-labelledby="login-heading">
      <h1 id="login-heading">ログイン</h1>
      <form id="login-form">
        <div class="field"><label for="email">メールアドレス</label><input id="email" name="email" type="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" required></div>
        <div class="field"><label for="password">パスワード</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" required><button id="toggle-password" type="button" aria-controls="password" aria-pressed="false">表示</button></div></div>
        <button class="login-button" type="submit">ログイン</button>
      </form>
      <button class="text-button recovery" type="button" data-placeholder="パスワードの再設定">パスワードを忘れた方</button>
      <div class="registration"><p>初めて利用する方</p><button class="register-button" type="button" data-placeholder="新規事業者登録">新しく利用を始める</button><p class="invitation-note">招待された方は、<br>招待メールのリンクからお進みください。</p></div>
      <p id="feedback" class="feedback" role="status" hidden></p>
    </section>
    <p class="prototype-note">画面の試作です。実際のログインはまだできません。</p>
  </main>
  <script src="login.js"></script>
</body>
</html>
